[project]
name = "daypilot"
version = "0.1.0"
description = "Personal planning and replanning agent"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
]

[project.optional-dependencies]
test = ["httpx2>=2.0,<3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
